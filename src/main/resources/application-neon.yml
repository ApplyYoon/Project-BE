# 내 컴퓨터에서 서버를 켜되, DB 만 Neon(PostgreSQL)의 dev 브랜치로 바꾸는 설정입니다. (이슈 #75)
# local 과 같이 켭니다:  SPRING_PROFILES_ACTIVE=local,neon  (뒤에 쓴 neon 의 값이 local 의 값을 덮어씁니다)
# Swagger·테스트 토큰 같은 로컬 편의 기능은 그대로 쓰고, 데이터는 Neon 에 남아서 서버를 껐다 켜도 사라지지 않습니다.
# 켜는 순서는 README "운영 DB(Neon)" 에 있습니다.
#
# ⚠️ 접속 주소·사용자·비밀번호는 이 파일에 적지 않습니다. 환경변수로만 받습니다. (개발용 dev 브랜치 것이라도 인터넷에 있는 진짜 DB 입니다)
# ⚠️ 여기에는 Neon 의 dev(개발용) 브랜치 것만 넣습니다. main(배포용) 브랜치 것은 배포 서버(Render)에만 넣습니다.
spring:
  datasource:
    # jdbc:postgresql://<Neon 호스트>/<DB 이름>?sslmode=require  모양이어야 합니다. (postgresql:// 로 시작하면 안 됨)
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  h2:
    console:
      enabled: false # Neon 을 쓸 때는 H2 화면이 필요 없습니다. 데이터는 Neon 콘솔의 Tables 에서 봅니다.
  jpa:
    hibernate:
      # 테이블을 만들거나 지우지 않고, 엔티티와 Neon 의 테이블이 맞는지 "검사만" 합니다.
      # 테이블은 db/schema.sql 로 미리 만들어 둡니다. 맞지 않으면 서버가 켜지지 않고 어느 테이블·컬럼이 다른지 알려 줍니다.
      # ⚠️ create-drop 이나 update 로 바꾸지 않습니다. create-drop 은 서버를 끌 때 Neon 의 테이블을 전부 지웁니다.
      ddl-auto: validate
    show-sql: false
