# 로컬 개발용: 따로 DB 설치 없이 H2 메모리 DB 사용 (서버 끄면 데이터 사라짐)
spring:
  datasource:
    url: jdbc:h2:mem:projectbe;MODE=PostgreSQL
    username: sa
    password:
  h2:
    console:
      enabled: true # http://localhost:8080/h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

# 내 컴퓨터에서 예약 작업을 시험할 때 쓰는 키입니다. 로컬에서만 통하는 값이라 올려도 됩니다.
# ⚠️ 배포 서버의 진짜 키(JOB_SECRET_KEY)는 어떤 파일에도 적지 않습니다. (docs/JOBS.md)
app:
  job:
    secret-key: local-job-key
  auth:
    # 내 컴퓨터에서만 통하는 테스트 토큰입니다. 로컬에서만 쓰는 값이라 올려도 됩니다.
    # Swagger 의 Authorize 에 이 값을 넣으면 테스트 사용자(1번)로 로그인한 것으로 봅니다. (CurrentUserProvider)
    # ⚠️ 배포 설정(application-prod.yml)에는 절대 넣지 않습니다. 넣으면 누구나 이 글자로 로그인할 수 있습니다.
    test-token: local-test-token
