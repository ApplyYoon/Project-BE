spring:
  application:
    name: project-be
  profiles:
    # 기본은 local (H2 메모리 DB). 배포 환경에서는 SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

server:
  port: ${PORT:8080}
