spring:
  application:
    name: project-be
  profiles:
    # 기본은 local (H2 메모리 DB). 배포 환경에서는 SPRING_PROFILES_ACTIVE=prod
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    open-in-view: false

app:
  auth:
    # 비밀번호를 해시(되돌릴 수 없는 값)로 바꿀 때 계산을 되풀이하는 횟수입니다. (domain/auth/PasswordHasher)
    # 클수록 안전하지만 가입·로그인이 그만큼 느려집니다. 기본값 210000 은 OWASP 권장값입니다.
    # 배포 서버가 느려서 로그인이 몇 초씩 걸리면 환경변수 PASSWORD_HASH_ITERATIONS 로 조절합니다. (docs/DEPLOY.md)
    # 비밀값이 아니라서 값을 적어도 됩니다. 횟수를 바꿔도 예전에 가입한 사람은 그대로 로그인됩니다.
    password-hash-iterations: ${PASSWORD_HASH_ITERATIONS:210000}
    # 내 컴퓨터에서 Swagger 로 "로그인이 필요한 API" 를 불러 볼 때 쓰는 테스트 토큰입니다. (docs/API-TEST-GUIDE.md)
    # 여기(공통 설정)는 비워 둡니다. 비어 있으면 테스트 토큰은 통하지 않습니다. 값은 application-local.yml 에만 있습니다.
    test-token: ""
  ai:
    # GPT(OpenAI) 설정입니다. (domain/coach/CoachAiClient)
    # ⚠️ GPT 키와 모델 이름의 자리는 여기(공통)에 없고 application-prod.yml 에만 있습니다.
    #    그래서 내 컴퓨터에서는 환경변수를 넣어도 GPT 를 부르지 않습니다. AI 기능은 배포 서버에서만 켜집니다.
    #
    # ── GPT 호출 기록 (이슈 #33, domain/gpt/GptUsageGuard) ──
    # 모든 GPT 호출은 gpt_usages 테이블에 기록됩니다. (서버를 껐다 켜도 안 사라짐)
    # 한 사람의 하루 한도(글 호출 · 작은 AI 기능 · 통화 횟수 · 통화 시간 · 웹 검색)는 2026-10-24 에 모두 없앴습니다.
    # 그래서 AI_DAILY_LIMIT_PER_USER 같은 환경변수는 이제 넣어도 쓰이지 않습니다.
    # 통화 한 번의 최대 길이(초)입니다. FE 가 이 시간이 되면 통화를 끊습니다.
    # 3분인 이유: 확인 통화의 복습 질문 2~3개는 3분 안에 끝나고, 대기 화면도 "1~3분" 이라고 안내합니다.
    # 길수록 주변 소리에 반응한 헛대화 요금도 늘어납니다. (통화 수정 8)
    call-max-seconds: ${AI_CALL_MAX_SECONDS:180}
    # 대략적인 비용(원). 기록용 어림값입니다. 실제 요금(달러)이 바뀌면 이 값만 고칩니다.
    # docs/DEPLOY.md 의 어림값(2026-10-11 가격표, 1달러 1,400원)에서 넉넉한 쪽을 골랐습니다.
    #   통화: 큰 음성 모델 3분에 약 240원 → 분당 80원 / 글: 문단 하나에 1원이 안 됨 → 1원
    # ⚠️ 어림값이라 실제 요금은 OpenAI 사용량 화면에서 확인해 주세요.
    cost-won-per-call-minute: ${AI_COST_WON_PER_CALL_MINUTE:80}
    cost-won-per-text-call: ${AI_COST_WON_PER_TEXT_CALL:1}
    # 과목 쌤 방의 "찾아보기"(웹 검색)를 켤지입니다. (domain/call/TutorWebSearch)
    # 끄려면 AI_TUTOR_WEB_SEARCH_ENABLED=false. 꺼도 과목 쌤은 성취기준 · 아는 것으로 그대로 답합니다.
    tutor-web-search-enabled: ${AI_TUTOR_WEB_SEARCH_ENABLED:true}
  neis:
    # 교육부 NEIS(교육정보 개방 포털) 인증키입니다. 학교 학사일정을 받을 때 씁니다. (domain/school/NeisClient, 이슈 #282)
    # 비어 있어도 동작하지만 NEIS 가 한 번에 5건만 줘서 한 주씩 나눠 받고, 오늘부터 120일만 받습니다.
    # 키는 https://open.neis.go.kr 에서 무료로 발급받아 Render 환경변수 NEIS_API_KEY 에 넣습니다. (값을 이 파일에 적지 않습니다)
    api-key: ${NEIS_API_KEY:}
  push:
    # 웹 푸시(앱을 닫아도 오는 알림) 설정입니다. (domain/push/WebPushSender)
    # ⚠️ VAPID 키의 자리는 여기(공통)에 없고 application-prod.yml 에만 있습니다. 그래서 내 컴퓨터에서는 푸시가 꺼져 있습니다.
    # 알림을 보내는 쪽이 누구인지 알리는 연락처입니다. 푸시 회사(애플·구글)가 문제가 생기면 이리로 연락합니다. 비밀값이 아닙니다.
    subject: ${PUSH_SUBJECT:https://github.com/Tmax-IT-Hope-School}
  job:
    # 예약 작업 주소(/api/v1/jobs/**)를 부를 때 X-Job-Key 헤더에 넣어야 하는 비밀 키입니다. (docs/JOBS.md)
    # 값은 여기에 적지 않고 환경변수 JOB_SECRET_KEY 로 받습니다. 비어 있으면 요청을 전부 거절합니다.
    secret-key: ${JOB_SECRET_KEY:}
  cors:
    # 우리 FE 주소에서 오는 요청만 허락합니다. 모든 주소 허용(*)은 쓰지 않습니다. (이슈 #7)
    # 기본값은 FE 개발 서버 주소입니다. 배포할 때는 환경변수 CORS_ALLOWED_ORIGINS 에 FE 배포 주소를 넣습니다.
    # 여러 개는 쉼표로 구분합니다. 환경변수를 넣으면 기본값은 쓰지 않습니다(통째로 바뀜).
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  # 구글로 시작하기(이슈 #19)에 쓰는 OAuth 클라이언트 ID 입니다. FE 의 VITE_GOOGLE_CLIENT_ID 와 같은 값이고, 공개돼도 되는 값입니다.
  # 비어 있으면 구글 로그인 API 가 503 을 돌려줍니다. 배포 서버는 환경변수 GOOGLE_CLIENT_ID 로 넣습니다. (docs/DEPLOY.md)
  # client secret 은 쓰지 않습니다. (구글 신분증을 구글의 tokeninfo 주소로 확인하는 방식)
  google:
    client-id: ${GOOGLE_CLIENT_ID:}

server:
  port: ${PORT:8080}
