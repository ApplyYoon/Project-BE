# 배포용: 값은 전부 환경변수로 주입 (코드에 비밀번호 쓰지 않기)
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      # 서버가 켜진 뒤 연결을 얻으려고 기다리는 최대 시간(밀리초). 기본은 30초라서, DB 가 멈추면 /health 도 오래 걸립니다.
      connection-timeout: 3000
      data-source-properties:
        # DB 서버가 대답이 없을 때 접속을 기다리는 최대 시간(초). 기본은 10초입니다.
        connectTimeout: 3
  jpa:
    # DATABASE_URL 이 틀려도 서버가 꺼지지 않게, 켜지는 동안 DB 에 접속하지 않도록 아래 3가지를 함께 설정합니다.
    # (이슈 #4) DB 상태는 /api/v1/health 의 "db" 값으로 확인합니다.
    # 1) DB 종류를 직접 알려 줍니다. (원래는 DB 에 접속해서 알아냅니다)
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        boot:
          # 2) 켜질 때 DB 정보를 조회하러 접속하는 동작을 끕니다.
          allow_jdbc_metadata_access: false
    hibernate:
      # 3) 켜질 때 테이블을 검사(validate)하면 DB 접속이 필요해서 none 으로 둡니다. 테이블은 미리 만들어 둬야 합니다.
      ddl-auto: none

# GPT(OpenAI) 키와 모델 이름입니다. 배포 서버의 환경변수에서만 받습니다. (Render 의 Environment 화면에서 입력)
# 이 자리는 배포 설정에만 있어서, AI 기능은 배포 서버에서만 켜집니다. 키가 비어 있으면 꺼집니다.
# ⚠️ 키 값을 이 파일에 직접 적지 않습니다. (적으면 git 에 영원히 남습니다)
app:
  # 시연 코드 로그인(DemoLoginService, 2026-10-18)의 코드입니다. 앱 안의 웹 화면처럼 구글 로그인이 안 되는 곳에서 시연 계정으로 들어옵니다.
  # 비어 있거나 8자보다 짧으면 기능이 꺼집니다(404). 시연이 끝나면 Render 의 환경변수를 지워서 끕니다.
  # ⚠️ 코드 값을 이 파일에 직접 적지 않습니다. (적으면 git 에 영원히 남아서 누구나 시연 계정으로 들어올 수 있습니다)
  auth:
    demo-login-code: ${DEMO_LOGIN_CODE:}
  ai:
    openai-api-key: ${OPENAI_API_KEY:}
    # 글을 쓰는 GPT 모델. 2026-10-11 에 gpt-6-luna 로 정했습니다. (가장 싼 최신 계열. docs/DEPLOY.md "AI(GPT) 켜기")
    # 다른 모델로 바꾸려면 환경변수 OPENAI_MODEL 에 이름을 넣습니다. 코드를 고치지 않아도 됩니다.
    model: ${OPENAI_MODEL:gpt-6-luna}
    # 음성 통화에 쓸 모델. 글 모델과 다른 "음성 전용" 모델이고 훨씬 비쌉니다. 비워 두면 통화만 꺼집니다. (docs/DEPLOY.md "AI 통화 켜기")
    realtime-model: ${OPENAI_REALTIME_MODEL:}
    # AI 의 목소리. OpenAI 가 정해 둔 이름 중 하나입니다.
    realtime-voice: ${OPENAI_REALTIME_VOICE:marin}
  # 웹 푸시(앱을 닫아도 오는 알림)의 VAPID 키입니다. 배포 서버의 환경변수에서만 받습니다. (docs/DEPLOY.md "웹 푸시 켜기")
  # 둘 중 하나라도 비어 있으면 푸시가 꺼집니다. 개인 키가 새면 남이 우리 학생들에게 알림을 보낼 수 있어서 비밀값입니다.
  # ⚠️ 키 값을 이 파일에 직접 적지 않습니다.
  push:
    vapid-public-key: ${VAPID_PUBLIC_KEY:}
    vapid-private-key: ${VAPID_PRIVATE_KEY:}

# 배포 서버에서는 Swagger 화면을 끕니다 (API 목록을 아무나 볼 수 없게)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
