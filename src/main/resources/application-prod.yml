# 배포용: 값은 전부 환경변수로 주입 (코드에 비밀번호 쓰지 않기)
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

# 배포 서버에서는 Swagger 화면을 끕니다 (API 목록을 아무나 볼 수 없게)
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
