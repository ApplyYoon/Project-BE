# 테스트 실행 설정입니다. (main 이 아니라 test 에만 있어서 서버 실행·배포에는 영향이 없습니다)
#
# 서버를 띄우는 테스트들은 모두 같은 메모리 DB(jdbc:h2:mem:projectbe)를 같이 쓰고, ddl-auto 가 create-drop 입니다.
# Spring 은 테스트 환경을 기본 32개까지만 보관하고, 넘치면 오래된 것을 끕니다.
# 하나가 꺼질 때 create-drop 이 같이 쓰는 DB 의 테이블을 모두 지워서, 다른 테스트가 "테이블이 없다"(500) 로 실패합니다.
# 그래서 보관 개수를 64개로 늘립니다. 테스트가 더 늘어 같은 에러가 다시 나면 이 숫자를 올리세요.
spring.test.context.cache.maxSize=64
