plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.diffplug.spotless' version '7.2.1'
}

group = 'com.ithopeschool'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Swagger: API 를 브라우저에서 직접 불러 보는 화면 (http://localhost:8080/swagger-ui.html)
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	// 웹 푸시: 앱을 닫아도 휴대폰에 알림을 보내는 표준(Web Push · VAPID)의 암호화를 대신 해 줍니다. (이슈 #32, 2026-10-15 선생님 허락)
	// 이 라이브러리는 옛 BouncyCastle(jdk15on)을 끌고 와서, 그것은 빼고 지금 버전(jdk18on)을 따로 넣습니다. (같은 클래스가 두 번 생기지 않게)
	// 같이 딸려 오는 비동기 HTTP 라이브러리(netty 포함)는 쓰지 않아서 뺍니다. 보내는 일은 자바 기본 HttpClient 로 합니다.
	implementation('nl.martijndwars:web-push:5.1.1') {
		exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
		exclude group: 'org.asynchttpclient'
	}
	// 암호화 계산(타원 곡선)을 하는 라이브러리. 웹 푸시가 씁니다.
	implementation 'org.bouncycastle:bcprov-jdk18on:1.80'
	// HTML 읽기: 학교 홈페이지의 가정통신문 · 공지사항 목록에서 제목 · 날짜만 골라냅니다. (2026-10-18 멘토 허락, domain/school/SchoolHomepageCrawler)
	// 'a.nttInfoBtn' 처럼 CSS 선택자로 골라서, 정규식보다 읽기 쉽고 홈페이지가 조금 바뀌어도 덜 깨집니다.
	implementation 'org.jsoup:jsoup:1.23.2'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
	// db/schema.sql 만 고쳐도 SchemaSqlTest 가 다시 돌도록 알려 줍니다. (이슈 #75)
	inputs.file('db/schema.sql')
}

spotless {
	java {
		googleJavaFormat()
		removeUnusedImports()
		trimTrailingWhitespace()
		endWithNewline()
		targetExclude('build/**')
	}
}
