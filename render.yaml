# Render(무료 서버) 배포 설정 파일입니다. (이슈 #8)
# Render 대시보드에서 New → Blueprint 로 이 저장소를 고르면, 이 파일대로 서버가 만들어집니다.
# 자세한 순서는 docs/DEPLOY.md 를 보세요.
services:
  - type: web # 인터넷에서 요청을 받는 서버
    name: project-be
    runtime: docker # 저장소의 Dockerfile 로 이미지를 만들어 실행합니다
    dockerfilePath: ./Dockerfile
    plan: free # 무료 (메모리 512MB, CPU 0.1)
    region: singapore # 한국과 가까운 아시아 지역. 한 번 정하면 바꿀 수 없습니다
    branch: main # 배포용 브랜치. develop 은 개발용이라 배포하지 않습니다
    autoDeployTrigger: commit # main 에 새 커밋이 들어오면 자동으로 다시 배포합니다
    healthCheckPath: /api/v1/health # 서버가 살아 있는지 Render 가 확인하는 주소 (200 이면 정상)
    envVars:
      # ── 값을 이 파일에 적지 않습니다. sync: false 는 "Render 설정 화면에서 직접 입력" 이라는 뜻입니다. ──
      # Neon 접속 정보는 배포용 브랜치(main) 것을 넣습니다. 만드는 방법은 docs/DEPLOY.md 에 있습니다.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USERNAME
        sync: false
      - key: DATABASE_PASSWORD
        sync: false
      # 이 서버를 불러도 되는 FE 주소 (예: https://내-fe.vercel.app). 끝에 / 를 붙이지 않습니다.
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      # GPT(OpenAI) 키와 모델 이름. 둘 다 넣어야 AI 기능이 켜집니다. 비워 두면 AI 없이 돌아갑니다. (docs/DEPLOY.md "AI(GPT) 켜기")
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false

      # ── 비밀이 아닌 값은 여기에 적어도 됩니다. ──
      # 자바가 메모리를 쓰는 방식입니다. 무료 서버는 메모리가 512MB 뿐이라 자바에게 알려 줘야 합니다.
      # (처음 배포해서 로그를 본 뒤 필요하면 고칩니다. 이유는 docs/DEPLOY.md 의 "메모리" 를 보세요.)
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=65 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -Xss512k
